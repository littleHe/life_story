<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>默认章节</title>
    <meta name="renderer" content="webkit">
    <link rel="stylesheet" href="/static/plugs/layui-v2.5.6/css/layui.css" media="all">
    <link rel="stylesheet" href="/static/plugs/font-awesome-4.7.0/css/font-awesome.min.css" media="all">
    <link rel="stylesheet" href="/static/admin/css/public.css" media="all">
    <script src="/static/plugs/layui-v2.5.6/layui.all.js"></script>
    <script src="/static/plugs/require-2.3.6/require.js"></script>
    <script src="/static/config-admin.js"></script>
    <script src="/static/admin/js/common.js"></script>
</head>
<body>
<div class="layuimini-container">
    <div class="layuimini-main">

        <blockquote class="layui-elem-quote">
            用户新建回忆录、兑换解锁成功后，系统会按下方<strong>「启用中」</strong>的条目自动生成一套章节（用户可在此基础上增删改）。
            停用的条目不参与生成；排序数字越大越靠前。
        </blockquote>

        <fieldset class="table-search-fieldset" id="searchFieldset_defaultChapterTable">
            <legend>条件搜索</legend>
            <form class="layui-form layui-form-pane form-search" id="searchForm" lay-filter="searchForm">
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">关键词</label>
                    <div class="layui-input-inline"><input type="text" name="keyword" placeholder="章节标题" class="layui-input"></div>
                </div>
                <div class="layui-form-item layui-inline">
                    <button type="submit" class="layui-btn layui-btn-normal" lay-submit lay-filter="search"><i class="fa fa-search"></i> 搜 索</button>
                    <button type="reset" class="layui-btn layui-btn-primary" id="defaultChapterReset"> 重 置 </button>
                </div>
            </form>
        </fieldset>

        <script type="text/html" id="toolbar">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-sm layuimini-btn-primary" lay-event="refresh" title="刷新"><i class="fa fa-refresh"></i></button>
                <button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="add"><i class="fa fa-plus"></i> 添加章节</button>
            </div>
        </script>

        <table id="defaultChapterTable" lay-filter="defaultChapterTable"></table>

        <script type="text/html" id="rowTool">
            <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="edit">编辑</a>
            <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</a>
        </script>

        <div id="formBox" style="display:none;padding:20px">
            <form class="layui-form" lay-filter="defaultChapterForm">
                <input type="hidden" name="id">
                <div class="layui-form-item">
                    <label class="layui-form-label">章节标题</label>
                    <div class="layui-input-block"><input type="text" name="title" placeholder="如：童年时光" class="layui-input"></div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">排序</label>
                    <div class="layui-input-inline"><input type="number" name="sort" class="layui-input"></div>
                    <div class="layui-form-mid">数字越大越靠前</div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-block">
                        <input type="radio" name="status" value="1" title="启用" checked>
                        <input type="radio" name="status" value="0" title="停用">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">备注</label>
                    <div class="layui-input-block"><input type="text" name="remark" class="layui-input"></div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="defaultChapterSave">保存</button></div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
layui.use(['table', 'form', 'layer'], function () {
    var $ = layui.$, form = layui.form, layer = layui.layer, table = layui.table;

    form.render();

    AdminAPI.table({
        elem: '#defaultChapterTable',
        url: '/admin-api/defaultchapter/index',
        toolbar: '#toolbar',
        defaultToolbar: ['filter', 'exports', 'print', { title: '搜索', layEvent: 'TABLE_SEARCH', icon: 'layui-icon-search' }],
        cols: [[
            { field: 'id', title: 'ID', width: 70 },
            { field: 'sort', title: '排序', width: 90 },
            { field: 'title', title: '章节标题', minWidth: 180 },
            { field: 'remark', title: '备注', minWidth: 160, templet: function (d) { return d.remark || '-'; } },
            { field: 'status', title: '状态', width: 90, templet: function (d) {
                return d.status == 1 ? '<span class="layui-badge layui-bg-blue">启用</span>' : '<span class="layui-badge">停用</span>';
            } },
            { field: 'created_at', title: '创建时间', width: 160 },
            { title: '操作', width: 140, templet: '#rowTool', fixed: 'right' }
        ]]
    });

    form.on('submit(search)', function (obj) { AdminAPI.reload('#defaultChapterTable', obj.field); return false; });
    $('#defaultChapterReset').on('click', function () { setTimeout(function () { AdminAPI.reload('#defaultChapterTable', {}); }, 0); });

    table.on('toolbar(defaultChapterTable)', function (obj) {
        var e = obj.event;
        if (e === 'refresh') {
            table.reload('defaultChapterTable');
        } else if (e === 'TABLE_SEARCH') {
            $('#searchFieldset_defaultChapterTable').toggleClass('layui-hide');
        } else if (e === 'add') {
            form.val('defaultChapterForm', { id: '', title: '', sort: 0, status: 1, remark: '' });
            AdminAPI.open('添加默认章节', '520px', 'auto', $('#formBox'));
        }
    });

    table.on('tool(defaultChapterTable)', function (obj) {
        var d = obj.data, e = obj.event;
        if (e === 'del') {
            AdminAPI.del('/admin-api/defaultchapter/delete', { id: d.id }, function () { obj.del(); });
        } else if (e === 'edit') {
            form.val('defaultChapterForm', { id: d.id, title: d.title, sort: d.sort, status: d.status, remark: d.remark });
            AdminAPI.open('编辑默认章节 #' + d.id, '520px', 'auto', $('#formBox'));
        }
    });

    form.on('submit(defaultChapterSave)', function (obj) {
        if (!obj.field.title) { layer.msg('请填写章节标题'); return false; }
        AdminAPI.post('/admin-api/defaultchapter/save', obj.field, function (res) {
            layer.msg(res.msg || '保存成功');
            layer.closeAll();
            table.reload('defaultChapterTable');
        });
        return false;
    });
});
</script>
</body>
</html>
