<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>回忆录后台</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/static/plugs/layui-v2.5.6/css/layui.css" media="all">
    <link rel="stylesheet" href="/static/plugs/font-awesome-4.7.0/css/font-awesome.min.css" media="all">
    <link rel="stylesheet" href="/static/plugs/lay-module/layuimini/layuimini.css" media="all">
    <link rel="stylesheet" href="/static/plugs/lay-module/layuimini/themes/default.css" media="all">
    <link rel="stylesheet" href="/static/admin/css/public.css" media="all">
    <!-- miniTheme 会往该节点写入配色（bgColorDefault），miniAdmin 的页面动画样式也注入在它之后。
         缺少该节点会导致配色方案与 pageAnim 全部静默失效（对齐 booking 框架页）。 -->
    <style id="layuimini-bg-color"></style>
    <script src="/static/plugs/layui-v2.5.6/layui.all.js"></script>
    <script src="/static/plugs/require-2.3.6/require.js"></script>
    <script src="/static/config-admin.js"></script>
</head>
<body class="layui-layout-body layuimini-all">
<div class="layui-layout layui-layout-admin">

    <div class="layui-header header">
        <div class="layui-logo layuimini-logo"></div>

        <div class="layuimini-header-content">
            <a>
                <div class="layuimini-tool"><i title="展开" class="fa fa-outdent" data-side-fold="1"></i></div>
            </a>

            <ul class="layui-nav layui-layout-left layuimini-header-menu layuimini-menu-header-pc layuimini-pc-show">
            </ul>

            <ul class="layui-nav layui-layout-left layuimini-header-menu layuimini-mobile-show">
                <li class="layui-nav-item">
                    <a href="javascript:;"><i class="fa fa-list-ul"></i> 选择模块</a>
                    <dl class="layui-nav-child layuimini-menu-header-mobile">
                    </dl>
                </li>
            </ul>

            <ul class="layui-nav layui-layout-right">
                <li class="layui-nav-item" lay-unselect>
                    <a href="javascript:;" data-refresh="刷新"><i class="fa fa-refresh"></i></a>
                </li>
                <li class="layui-nav-item" lay-unselect>
                    <a href="javascript:;" data-clear="清理" class="layuimini-clear"><i class="fa fa-trash-o"></i></a>
                </li>
                <li class="layui-nav-item mobile layui-hide-xs" lay-unselect>
                    <a href="javascript:;" data-check-screen="full"><i class="fa fa-arrows-alt"></i></a>
                </li>
                <li class="layui-nav-item layuimini-setting">
                    <a href="javascript:;">
                        <img src="/static/admin/images/logo.svg" class="layui-nav-img" width="40" height="40" style="border-radius:4px">
                        <cite class="adminName">管理员</cite>
                        <span class="layui-nav-more"></span>
                    </a>
                    <dl class="layui-nav-child">
                        <dd><hr></dd>
                        <dd><a href="javascript:;" class="login-out">退出登录</a></dd>
                    </dl>
                </li>
                <li class="layui-nav-item layuimini-select-bgcolor" lay-unselect>
                    <a href="javascript:;" data-bgcolor="配色方案"><i class="fa fa-ellipsis-v"></i></a>
                </li>
            </ul>
        </div>
    </div>

    <!-- 左侧菜单（由 init 接口动态渲染，含 Font Awesome 图标） -->
    <div class="layui-side layui-bg-black layuimini-menu-left">
    </div>

    <div class="layuimini-loader">
        <div class="layuimini-loader-inner"></div>
    </div>

    <div class="layuimini-make"></div>
    <div class="layuimini-site-mobile"><i class="layui-icon"></i></div>

    <div class="layui-body">
        <!-- 必须带 layuimini-tab 类：layuimini.css 的高度规则（.layuimini-tab{height:100%}、
             .layuimini-tab .layui-tab-content{height:calc(100% - 37px)}）与 miniTab.js 的全部选择器
             都挂在该类上；缺失会导致内容 iframe 退回默认 150px 高，页面被压成一条窄带。 -->
        <div class="layuimini-tab layui-tab-rollTool layui-tab" lay-filter="layuiminiTab" lay-allowclose="true">
            <ul class="layui-tab-title">
                <li class="layui-this" id="layuiminiHomeTabId" lay-id=""></li>
            </ul>
            <div class="layui-tab-control">
                <li class="layuimini-tab-roll-left layui-icon layui-icon-left"></li>
                <li class="layuimini-tab-roll-right layui-icon layui-icon-right"></li>
                <li class="layui-tab-tool layui-icon layui-icon-down">
                    <ul class="layui-nav close-box">
                        <li class="layui-nav-item">
                            <a href="javascript:;"><span class="layui-nav-more"></span></a>
                            <dl class="layui-nav-child">
                                <dd><a href="javascript:;" layuimini-tab-close="current">关 闭 当 前</a></dd>
                                <dd><a href="javascript:;" layuimini-tab-close="other">关 闭 其 他</a></dd>
                                <dd><a href="javascript:;" layuimini-tab-close="all">关 闭 全 部</a></dd>
                            </dl>
                        </li>
                    </ul>
                </li>
            </div>
            <div class="layui-tab-content">
                <div id="layuiminiHomeTabIframe" class="layui-tab-item layui-show"></div>
            </div>
        </div>
    </div>
</div>

<script>
require(['jquery', 'miniAdmin'], function ($, miniAdmin) {
    var options = {
        iniUrl: '/admin-api/init',
        clearUrl: '',
        urlHashLocation: true,
        bgColorDefault: 0,   // 配色方案 0：白顶栏 + #192027 logo + #28333E 侧栏（与参考后台一致）
        multiModule: true,   // 一级菜单渲染到顶栏，左侧显示当前模块的子菜单（对齐参考界面）
        menuChildOpen: false,
        loadingTime: 0,
        pageAnim: true,
        maxTabNum: 20
    };

    // 用 /admin-api/info 做登录态预检（未登录返回 401 → 跳登录页），
    // 同时复用它的返回值渲染右上角用户名，避免 init 接口被请求两次。
    $.getJSON('/admin-api/info', function (res) {
        // 注意：不要在外部再手动调用 miniTheme.render() / miniTab.listen()。
        // miniAdmin.render() 内部已用完整参数调用二者；而 miniTheme.render(options)
        // 未做参数保护（options.bgColorDefault 直接取值），无参调用会抛 TypeError，
        // 中断本回调导致 .layuimini-make 遮罩与加载动画永不消失（表现为全白页面卡转圈）。
        miniAdmin.render(options);

        if (res && res.code === 0 && res.data) {
            $('.adminName').text(res.data.nickname || res.data.username || '管理员');
        }

        $('.login-out').on('click', function () {
            $.ajax({
                url: '/admin-api/logout',
                type: 'POST',
                dataType: 'json',
                success: function () { top.location.href = '/admin/login.html'; },
                error: function () { top.location.href = '/admin/login.html'; }
            });
        });
    }).fail(function (xhr) {
        if (xhr.status === 401 || xhr.status === 403) {
            top.location.href = '/admin/login.html';
            return;
        }
        // 其他失败（404/500 等）显式提示，避免只留一个永不消失的加载动画
        $('.layuimini-loader').hide();
        layui.layer.msg('初始化失败（HTTP ' + xhr.status + '），请确认后端服务已启动且接口前缀为 /admin-api/', {
            icon: 2,
            time: 6000
        });
    });
});
</script>
</body>
</html>
