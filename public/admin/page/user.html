<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>授权用户</title>
    <meta name="renderer" content="webkit">
    <link rel="stylesheet" href="/static/plugs/layui-v2.5.6/css/layui.css" media="all">
    <link rel="stylesheet" href="/static/plugs/font-awesome-4.7.0/css/font-awesome.min.css" media="all">
    <link rel="stylesheet" href="/static/admin/css/public.css" media="all">
    <script src="/static/plugs/layui-v2.5.6/layui.all.js"></script>
    <script src="/static/plugs/require-2.3.6/require.js"></script>
    <script src="/static/config-admin.js"></script>
    <script src="/static/admin/js/common.js"></script>
</head>
<body>
<div class="layuimini-container">
    <div class="layuimini-main">

        <fieldset class="table-search-fieldset" id="searchFieldset_userTable">
            <legend>条件搜索</legend>
            <form class="layui-form layui-form-pane form-search" id="searchForm" lay-filter="searchForm">
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">关键词</label>
                    <div class="layui-input-inline"><input type="text" name="keyword" placeholder="昵称/unionid/openid" class="layui-input"></div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">授权</label>
                    <div class="layui-input-inline">
                        <select name="authorized"><option value="">全部</option><option value="1">已授权</option><option value="0">未授权</option></select>
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-inline">
                        <select name="status"><option value="">全部</option><option value="1">启用</option><option value="0">禁用</option></select>
                    </div>
                </div>
                <div class="layui-form-item layui-inline">
                    <button type="submit" class="layui-btn layui-btn-normal" lay-submit lay-filter="search"><i class="fa fa-search"></i> 搜 索</button>
                    <button type="reset" class="layui-btn layui-btn-primary" id="userReset"> 重 置 </button>
                </div>
            </form>
        </fieldset>

        <script type="text/html" id="toolbar">
            <div class="layui-btn-container">
                <button class="layui-btn layui-btn-sm layuimini-btn-primary" lay-event="refresh" title="刷新"><i class="fa fa-refresh"></i></button>
                <button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="add"><i class="fa fa-plus"></i> 添加</button>
            </div>
        </script>

        <table id="userTable" lay-filter="userTable"></table>

        <script type="text/html" id="rowTool">
            <a class="layui-btn layui-btn-xs" lay-event="detail">明细</a>
            <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="edit">编辑</a>
            <a class="layui-btn layui-btn-xs {{d.status==1?'layui-btn-warm':'layui-btn'}}" lay-event="toggle">{{d.status==1?'禁用':'启用'}}</a>
        </script>

        <div id="formBox" style="display:none;padding:20px">
            <form class="layui-form" lay-filter="userForm">
                <input type="hidden" name="id">
                <div class="layui-form-item">
                    <label class="layui-form-label">昵称</label>
                    <div class="layui-input-block"><input type="text" name="nickname" class="layui-input"></div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">角色</label>
                    <div class="layui-input-block">
                        <input type="radio" name="role" value="0" title="普通用户" checked>
                        <input type="radio" name="role" value="1" title="管理员">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">状态</label>
                    <div class="layui-input-block">
                        <input type="radio" name="status" value="1" title="启用" checked>
                        <input type="radio" name="status" value="0" title="禁用">
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-block"><button class="layui-btn" lay-submit lay-filter="userSave">保存</button></div>
                </div>
            </form>
        </div>

        <div id="detailBox" style="display:none;padding:20px"></div>
    </div>
</div>

<script>
layui.use(['table', 'form', 'layer'], function () {
    var $ = layui.$, form = layui.form, layer = layui.layer, table = layui.table;

    form.render(); // 渲染搜索区 select 等表单控件（layui 不会自动渲染）

    AdminAPI.table({
        elem: '#userTable',
        url: '/admin-api/user/index',
        toolbar: '#toolbar',
        defaultToolbar: ['filter', 'exports', 'print', { title: '搜索', layEvent: 'TABLE_SEARCH', icon: 'layui-icon-search' }],
        cols: [[
            { field: 'id', title: 'ID', width: 70 },
            { field: 'nickname', title: '昵称', width: 140 },
            { field: 'role_text', title: '角色', width: 100 },
            { field: 'authorized_text', title: '授权', width: 100, templet: function (d) {
                return d.authorized ? '<span class="layui-badge layui-bg-green">已授权</span>' : '<span class="layui-badge layui-bg-gray">未授权</span>';
            } },
            { field: 'project_count', title: '项目数', width: 90 },
            { field: 'editable_count', title: '编辑中', width: 90 },
            { field: 'status', title: '状态', width: 90, templet: function (d) {
                return d.status == 1 ? '<span class="layui-badge layui-bg-blue">启用</span>' : '<span class="layui-badge">禁用</span>';
            } },
            { field: 'created_at', title: '注册时间', width: 160 },
            { title: '操作', width: 200, templet: '#rowTool', fixed: 'right' }
        ]]
    });

    form.on('submit(search)', function (obj) { AdminAPI.reload('#userTable', obj.field); return false; });
    $('#userReset').on('click', function () { setTimeout(function () { AdminAPI.reload('#userTable', {}); }, 0); });

    table.on('toolbar(userTable)', function (obj) {
        var e = obj.event;
        if (e === 'refresh') {
            table.reload('userTable');
        } else if (e === 'TABLE_SEARCH') {
            $('#searchFieldset_userTable').toggleClass('layui-hide');
        } else if (e === 'add') {
            form.val('userForm', { id: '', nickname: '', role: 0, status: 1 });
            AdminAPI.open('添加用户', '480px', 'auto', $('#formBox'));
        }
    });

    table.on('tool(userTable)', function (obj) {
        var d = obj.data, event = obj.event;
        if (event === 'toggle') {
            AdminAPI.post('/admin-api/user/status', { id: d.id, status: d.status == 1 ? 0 : 1 }, function () {
                table.reload('userTable');
            });
        } else if (event === 'edit') {
            form.val('userForm', { id: d.id, nickname: d.nickname, role: d.role, status: d.status });
            AdminAPI.open('编辑用户 #' + d.id, '480px', 'auto', $('#formBox'));
        } else if (event === 'detail') {
            $.getJSON('/admin-api/user/detail?id=' + d.id, function (res) {
                if (!res || res.code !== 0) return layer.msg('加载失败');
                var u = res.data.user, ps = res.data.projects || [], ls = res.data.logs || [];
                var html = '<p>昵称：' + (u.nickname || '') + '　ID：' + u.id + '</p>' +
                    '<p>unionid：' + (u.unionid || '-') + '</p>' +
                    '<hr><p>项目（' + ps.length + '）：</p><ul>';
                ps.forEach(function (p) { html += '<li>' + (p.name || '') + ' [' + p.status + ']</li>'; });
                html += '</ul><hr><p>核销记录（' + ls.length + '）</p>';
                $('#detailBox').html(html);
                AdminAPI.open('用户明细 #' + d.id, '480px', 'auto', $('#detailBox'));
            });
        }
    });

    form.on('submit(userSave)', function (obj) {
        AdminAPI.post('/admin-api/user/save', obj.field, function (res) {
            layer.msg(res.msg || '保存成功');
            layer.closeAll();
            table.reload('userTable');
        });
        return false;
    });
});
</script>
</body>
</html>
